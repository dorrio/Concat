name: Portable projects (dev build)

# The fork's own loop for the portable-project packages: every push to a
# feature/* branch checks and tests the engine side quickly, then builds the
# desktop apps (build-app.yml) and the phones (mobile.yml) from the same
# commit, so the artifacts on the run are what goes onto the Mac and the
# Android phone.
on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

concurrency:
  group: portable-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Package tests and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ORT_VERSION: 1.28.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          cache-on-failure: true
      # No toolchain on the machine this is written on: rustfmt's changes
      # come back as a patch to apply, rather than failing the run.
      - name: rustfmt
        working-directory: src
        run: |
          cargo fmt
          git diff > ../fmt.patch
          if [ -s ../fmt.patch ]; then echo "::warning::rustfmt changed files; see the fmt-patch artifact"; cat ../fmt.patch; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fmt-patch
          path: fmt.patch
          if-no-files-found: ignore
      - run: python3 scripts/locales.py --check
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake
      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          scripts/ci/fetch.sh ffmpeg-linux64 ffmpeg.tar.xz
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
      - name: ONNX Runtime
        run: |
          set -euo pipefail
          stem="onnxruntime-linux-x64-$ORT_VERSION"
          scripts/ci/fetch.sh onnxruntime-linux-x64 onnxruntime.tgz
          tar -xzf onnxruntime.tgz
          ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib:$PWD/$stem/lib"
          } >> "$GITHUB_ENV"
      - name: sherpa-onnx libraries
        run: |
          set -euo pipefail
          version=$(grep -A1 'name = "sherpa-onnx-sys"' src/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          stem="sherpa-onnx-v$version-linux-x64-static-lib"
          scripts/ci/fetch.sh sherpa-onnx-linux-x64-static-lib sherpa.tar.bz2
          mkdir -p sherpa
          tar -xjf sherpa.tar.bz2 -C sherpa
          echo "SHERPA_ONNX_LIB_DIR=$PWD/sherpa/$stem/lib" >> "$GITHUB_ENV"
      - name: Package tests
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test -p concat-host --lib package -j 2
      - name: Lints of everything the feature touches
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo clippy -p concat-host -p concat-api -p concat --all-targets -j 2 -- -D warnings
      - name: Locale test
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test -p concat --lib i18n -j 2

  # Not gated on the check: a lint there should not hold back the apps.
  desktop:
    name: Desktop apps
    uses: ./.github/workflows/build-app.yml

  phones:
    name: Phones
    uses: ./.github/workflows/mobile.yml
